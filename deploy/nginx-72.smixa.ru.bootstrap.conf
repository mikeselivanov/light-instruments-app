# STAGE 1 of 2. Install this first, reload, then issue the certificate.
#
# The final config references /etc/letsencrypt/live/72.smixa.ru/, and nginx
# refuses to load a config whose ssl_certificate does not exist yet — while
# certbot cannot issue that certificate until an ACME challenge can be served
# over port 80. This file breaks that cycle: port 80 only, no TLS.
#
# Install as /etc/nginx/sites-available/smixa-72.conf and symlink into
# sites-enabled under the SAME name. The name matters: sites-enabled is
# included with a glob, which nginx expands alphabetically, and the first
# server block for a port becomes the default for requests whose SNI matches
# nothing. A file named "72.smixa.ru" would sort ahead of "bc-coliseum" and
# quietly take over that role from the existing site.

server {
    listen 80;
    listen [::]:80;
    # Both names: certbot proves control of each one separately over port 80,
    # so www has to be served here too or the expanded certificate cannot be
    # issued. www.72.smixa.ru needs its own DNS A record pointing at this box
    # before any of that can work.
    server_name 72.smixa.ru www.72.smixa.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 404;
    }
}
