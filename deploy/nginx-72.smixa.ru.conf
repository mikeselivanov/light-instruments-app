# STAGE 2 of 2. Replaces the bootstrap config once the certificate exists.
#
# Install as /etc/nginx/sites-available/smixa-72.conf, symlinked into
# sites-enabled under the SAME name.
#
# The filename is not arbitrary. sites-enabled is included with a glob, which
# nginx expands alphabetically, and the first server block for a given port
# becomes the default for connections whose SNI matches no server_name. This
# VPS already serves bc-coliseum.duckdns.org and bc-coliseum-admin.duckdns.org,
# and a file named "72.smixa.ru" would sort ahead of "bc-" and silently take
# that default away from them. "smixa-72.conf" sorts after.
#
# Coexisting on 80/443 is otherwise free: nginx dispatches by Host header, and
# TLS SNI lets it pick the certificate before the request is even parsed.
#
# ---------------------------------------------------------------------------
# Updating this file on the server
#
# Not part of deploy.sh on purpose. That script runs on every app release;
# this box also serves bc-coliseum, and a bad reload here takes that down too.
# Config changes are rare and deserve to be deliberate.
#
#   scp deploy/nginx-72.smixa.ru.conf root@72.smixa.ru:/tmp/smixa-72.conf
#   ssh root@72.smixa.ru '
#     set -e
#     LIVE=/etc/nginx/sites-available/smixa-72.conf
#     BAK="$LIVE.bak.$(date +%F-%H%M%S)"
#     cp "$LIVE" "$BAK"
#     cp /tmp/smixa-72.conf "$LIVE"
#     if nginx -t; then
#       systemctl reload nginx && echo "reloaded, backup at $BAK"
#     else
#       cp "$BAK" "$LIVE"; echo "rejected, rolled back" >&2; exit 1
#     fi'
#
# `nginx -t` before `reload`, and restore the backup if it fails: nginx keeps
# serving the old config while the test runs, so a rejected file costs nothing
# as long as it never reaches a reload. `reload`, never `restart` — reload
# re-execs workers without dropping a connection on any site on the box.
# ---------------------------------------------------------------------------

server {
    listen 80;
    listen [::]:80;
    server_name 72.smixa.ru www.72.smixa.ru;

    # Kept for certificate renewals, which reuse the webroot challenge. Both
    # names are served here because certbot proves control of each separately.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # $host, not a literal: this block answers for both names, and www is sent
    # on to its own TLS block below rather than being landed on directly, so
    # the redirect to the canonical host happens exactly once, over HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

# www exists only to hand visitors to the canonical host.
#
# It is a redirect rather than an alias on purpose. A service worker, an
# installed PWA's identity, and everything in localStorage are all scoped to an
# exact origin, so serving the app from both names would produce two unrelated
# installs with separate favourites that each think they are the app. One
# origin, always: 72.smixa.ru.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.72.smixa.ru;

    # The same certificate file — it covers both names once expanded with the
    # certbot command in the header comment. Serving this block with a
    # certificate that lacks www would show the very warning it exists to
    # avoid, because the browser checks the name before it follows any redirect.
    ssl_certificate /etc/letsencrypt/live/72.smixa.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/72.smixa.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://72.smixa.ru$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name 72.smixa.ru;

    root /var/www/72.smixa.ru;
    index index.html;

    # Written by `certbot certonly --webroot`, which issues the certificate
    # without editing any nginx config — deliberate on a box that is already
    # serving a live site and its admin panel. To add www to an existing
    # certificate, re-run it with both names and --expand:
    #
    #   certbot certonly --webroot -w /var/www/certbot --expand \
    #       -d 72.smixa.ru -d www.72.smixa.ru
    #
    # The file paths do not change, so nothing below needs editing.
    ssl_certificate /etc/letsencrypt/live/72.smixa.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/72.smixa.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    # woff2 is already compressed; gzipping it again only burns CPU.

    # The service worker must never be served stale, or users get pinned to an
    # old build with no way out.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    location = /manifest.json {
        add_header Cache-Control "no-cache";
        expires off;
    }

    # Metro hashes these filenames, so they can be cached indefinitely.
    location /_expo/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Push service. Same origin as the app, so no CORS is involved.
    #
    # The subscribe endpoint is open to the internet and writes a row per call,
    # hence the rate limit. The zone has to be declared once in the http block
    # of /etc/nginx/nginx.conf:
    #   limit_req_zone $binary_remote_addr zone=api:10m rate=10r/m;
    location /api/ {
        limit_req zone=api burst=5 nodelay;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA fallback: every unknown path resolves to the single index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
