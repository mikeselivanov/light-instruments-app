# Reference copy of the server block for 72.smixa.ru.
# Install on the VPS as /etc/nginx/sites-available/72.smixa.ru and symlink
# into sites-enabled. certbot --nginx rewrites the TLS parts on first run.
#
# This coexists with the other site already on 80/443: nginx dispatches by
# Host header, and TLS SNI lets it pick the certificate before the request is
# even parsed. No extra ports are involved.

server {
    listen 80;
    listen [::]:80;
    server_name 72.smixa.ru;

    # certbot replaces this with a redirect to https after issuing the cert.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name 72.smixa.ru;

    root /var/www/72.smixa.ru;
    index index.html;

    # ssl_certificate / ssl_certificate_key are filled in by certbot.

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    # woff2 is already compressed; gzipping it again only burns CPU.

    # The service worker must never be served stale, or users get pinned to an
    # old build with no way out.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    location = /manifest.json {
        add_header Cache-Control "no-cache";
        expires off;
    }

    # Metro hashes these filenames, so they can be cached indefinitely.
    location /_expo/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA fallback: every unknown path resolves to the single index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
