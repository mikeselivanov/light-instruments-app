# STAGE 2 of 2. Replaces the bootstrap config once the certificate exists.
#
# Install as /etc/nginx/sites-available/smixa-72.conf, symlinked into
# sites-enabled under the SAME name.
#
# The filename is not arbitrary. sites-enabled is included with a glob, which
# nginx expands alphabetically, and the first server block for a given port
# becomes the default for connections whose SNI matches no server_name. This
# VPS already serves bc-coliseum.duckdns.org and bc-coliseum-admin.duckdns.org,
# and a file named "72.smixa.ru" would sort ahead of "bc-" and silently take
# that default away from them. "smixa-72.conf" sorts after.
#
# Coexisting on 80/443 is otherwise free: nginx dispatches by Host header, and
# TLS SNI lets it pick the certificate before the request is even parsed.

server {
    listen 80;
    listen [::]:80;
    server_name 72.smixa.ru;

    # Kept for certificate renewals, which reuse the webroot challenge.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name 72.smixa.ru;

    root /var/www/72.smixa.ru;
    index index.html;

    # Written by `certbot certonly --webroot`, which issues the certificate
    # without editing any nginx config — deliberate on a box that is already
    # serving a live site and its admin panel.
    ssl_certificate /etc/letsencrypt/live/72.smixa.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/72.smixa.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    # woff2 is already compressed; gzipping it again only burns CPU.

    # The service worker must never be served stale, or users get pinned to an
    # old build with no way out.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    location = /manifest.json {
        add_header Cache-Control "no-cache";
        expires off;
    }

    # Metro hashes these filenames, so they can be cached indefinitely.
    location /_expo/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Push service. Same origin as the app, so no CORS is involved.
    #
    # The subscribe endpoint is open to the internet and writes a row per call,
    # hence the rate limit. The zone has to be declared once in the http block
    # of /etc/nginx/nginx.conf:
    #   limit_req_zone $binary_remote_addr zone=api:10m rate=10r/m;
    location /api/ {
        limit_req zone=api burst=5 nodelay;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA fallback: every unknown path resolves to the single index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
