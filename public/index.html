<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <style>
      /* Expo's reset above sets height and overflow but no background, so the
         page defaults to white. That shows up in two places on iOS: as a white
         flash before React mounts, and as a white status bar area in the
         installed app, since iOS colours that from the page background. The
         app's own dark ground is painted by a View inside React, far too late
         for either. */
      html,
      body {
        background-color: #0e0d12;
        /* Tells the browser this is a dark page, so scrollbars, form controls
           and overscroll areas match instead of rendering light. */
        color-scheme: dark;
      }
    </style>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0e0d12" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- "black", not "black-translucent": translucent makes the web view
         extend underneath the status bar, and compensating for that needs
         viewport-fit=cover plus real safe-area insets. Expo's viewport meta
         has no viewport-fit, so env(safe-area-inset-top) resolves to 0 and
         the date row would sit under the clock with nothing to push it down. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="72 Имени" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function (error) {
            console.error('Service worker registration failed:', error);
          });
        });
      }
    </script>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
